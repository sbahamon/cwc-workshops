[project]
name = "sre-agent-evals"
version = "0.1.0"
description = "Eval lab for the Incident-2277 SRE agent: case generator, graders, Managed Agents runner."
requires-python = ">=3.10"
dependencies = [
    "anthropic==1.13.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
